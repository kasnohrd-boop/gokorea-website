backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog / Artikel"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Judul Artikel", name: "title", widget: "string"}
      - {label: "Tanggal Publish", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
      - {label: "Gambar Utama (Thumbnail)", name: "thumbnail", widget: "image", required: false, media_folder: "/images/uploads"}
      - {label: "Ringkasan", name: "excerpt", widget: "text"}
      - {label: "Isi Artikel", name: "body", widget: "markdown"}
