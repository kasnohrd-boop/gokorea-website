backend:
  name: git-gateway
  branch: main # Pastikan ini sesuai dengan branch default di GitHub Anda (biasanya main atau master)

media_folder: "images/uploads" # Folder tempat gambar dari CMS disimpan
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog / Artikel"
    folder: "content/blog" # Folder tempat artikel disimpan
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Judul Artikel", name: "title", widget: "string"}
      - {label: "Tanggal Publish", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
      - {label: "Gambar Utama (Thumbnail)", name: "thumbnail", widget: "image", required: false, media_folder: "/images/uploads"}
      - {label: "Ringkasan", name: "excerpt", widget: "text"}
      - {label: "Isi Artikel", name: "body", widget: "markdown"}